<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register · BrainGrow</title>
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">🧠</div>
      <h1 class="auth-title">BrainGrow</h1>
      <p class="auth-sub">Създай нов акаунт</p>

      <div class="field">
        <label for="username">Потребителско име</label>
        <input type="text"     id="username" class="input" placeholder="username" autocomplete="username" />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email"    id="email"    class="input" placeholder="you@example.com" autocomplete="email" />
      </div>
      <div class="field">
        <label for="password">Парола</label>
        <input type="password" id="password" class="input" placeholder="мин. 8 символа"  autocomplete="new-password" />
      </div>

      <div id="error-msg" class="error-msg" role="alert"></div>

      <button class="btn btn-primary btn-lg btn-full" onclick="doRegister()">Регистрирай се</button>
      <p class="auth-link">Вече имаш акаунт? <a href="login.html">Влез</a></p>
    </div>
  </div>

  <script>
    async function doRegister() {
      const username = document.getElementById("username").value.trim();
      const email    = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const errEl    = document.getElementById("error-msg");
      errEl.textContent = "";

      if (!username || !email || !password) {
        errEl.textContent = "Попълни всички полета.";
        return;
      }
      if (password.length < 8) {
        errEl.textContent = "Паролата трябва да е поне 8 символа.";
        return;
      }

      const btn = document.querySelector(".btn-primary");
      btn.textContent = "Регистрация…";
      btn.disabled = true;

      try {
        const res  = await fetch("http://localhost:3000/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, email, password })
        });
        const data = await res.json();

        if (res.ok) {
          window.location.href = "login.html";
        } else {
          errEl.textContent = data.message || "Грешка при регистрация.";
        }
      } catch {
        errEl.textContent = "Сървърът не отговаря.";
      } finally {
        btn.textContent = "Регистрирай се";
        btn.disabled = false;
      }
    }

    document.addEventListener("keydown", e => { if (e.key === "Enter") doRegister(); });
  </script>
</body>
</html>
