<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login · BrainGrow</title>
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">🧠</div>
      <h1 class="auth-title">BrainGrow</h1>
      <p class="auth-sub">Влез в профила си</p>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" class="input" placeholder="you@example.com" autocomplete="email" />
      </div>
      <div class="field">
        <label for="password">Парола</label>
        <input type="password" id="password" class="input" placeholder="••••••••" autocomplete="current-password" />
      </div>

      <div id="error-msg" class="error-msg" role="alert"></div>

      <button class="btn btn-primary btn-lg btn-full" onclick="doLogin()">Влез</button>
      <p class="auth-link">Нямаш акаунт? <a href="register.html">Регистрирай се</a></p>
    </div>
  </div>

  <script>
    async function doLogin() {
      const email    = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const errEl    = document.getElementById("error-msg");
      errEl.textContent = "";

      if (!email || !password) {
        errEl.textContent = "Попълни email и парола.";
        return;
      }

      const btn = document.querySelector(".btn-primary");
      btn.textContent = "Зареждане…";
      btn.disabled = true;

      try {
        const res  = await fetch("http://localhost:3000/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (res.ok) {
          localStorage.setItem("token", data.token);
          localStorage.setItem("user",  JSON.stringify(data.user));
          window.location.href = "flashcards.html";
        } else {
          errEl.textContent = data.message || "Грешни данни.";
        }
      } catch {
        errEl.textContent = "Сървърът не отговаря. Стартиран ли е бекендът?";
      } finally {
        btn.textContent = "Влез";
        btn.disabled = false;
      }
    }

    document.addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
  </script>
</body>
</html>
