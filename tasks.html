<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tasks</title>
<style>
body {
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background:#0b1220;
    color:white;
}

.app {
    min-height: 100vh;
}

/* top bar */
.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 40px;
    background: #0f172a;
    border-bottom: 1px solid rgba(255,255,255,0.05);
}

.logo {
    font-size: 20px;
    font-weight: bold;
}

#greeting {
    font-size: 16px;
}

.logout {
    background: #ef4444;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    color: white;
    cursor: pointer;
}

/* container */
.container {
    max-width: 700px;
    margin: auto;
    padding: 40px 20px;
}

h1 {
    text-align: center;
    margin-bottom: 30px;
}

/* form */
.task-form {
    background: #0f172a;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 30px;
}

.task-form input,
.task-form textarea,
.task-form select {
    width: 100%;
    padding: 12px;
    margin-bottom: 10px;
    border-radius: 8px;
    border: none;
    background: #020617;
    color: white;
}

.task-form textarea {
    resize: none;
    height: 70px;
}

#addBtn {
    background: #22c55e;
    border: none;
    padding: 12px;
    border-radius: 8px;
    color: white;
    cursor: pointer;
    width: 100%;
}

/* tasks */
.tasks-wrapper {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.task {
    background: #0f172a;
    padding: 16px;
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.task-left {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.task-title {
    font-weight: bold;
}

.task-type {
    font-size: 12px;
    opacity: 0.6;
}

.task-desc {
    font-size: 13px;
    opacity: 0.8;
}

.task-meta {
    display: flex;
    gap: 15px;
    font-size: 12px;
    opacity: 0.8;
    margin-top: 6px;
}

.delete-btn {
    background: #ef4444;
    border: none;
    color: white;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
}

.row {
    display: flex;
    gap: 10px;
}

.row input,
.row select {
    flex: 1;
}
</style>
</head>
<body>

<div class="app">
    <div class="topbar">
        <div class="logo">Tasks</div>
        <div id="greeting"></div>
        <button class="logout" id="logoutBtn">Logout</button>
    </div>

    <div class="container">
        <h1>Your Tasks</h1>
        <div class="task-form">
            <input type="text" id="title" placeholder="Task title..." required>
            <input type="text" id="type" placeholder="Type (study, work...)" required>
            <textarea id="description" placeholder="Description (optional)"></textarea>
            <div class="row">
                <input type="date" id="due">
                <select id="importance">
                    <option value="">Priority</option>
                    <option value="1">1 - very low</option>
                    <option value="3">3 - low</option>
                    <option value="5">5 - medium</option>
                    <option value="7">7 - high</option>
                    <option value="10">10 - critical</option>
                </select>
            </div>
            <button id="addBtn">Add Task</button>
        </div>

        <div class="tasks-wrapper">
            <div id="taskList"></div>
        </div>
    </div>
</div>

<script>
//const currentUser = JSON.parse(localStorage.getItem("mockUser"));
//if(!currentUser) window.location.href = "login.html";

// MOCK USER FOR TESTING - comment out the login redirect
const currentUser = JSON.parse(localStorage.getItem("mockUser")) || {
    username: "TestUser",
    email: "test@example.com"
};
// if(!currentUser) window.location.href = "login.html"; // <-- comment this out for test

document.getElementById("greeting").textContent = `Hello, ${currentUser.username}`;

// MOCK TASKS storage
let tasks = JSON.parse(localStorage.getItem("mockTasks") || "[]").filter(t => t.user === currentUser.email);
const taskList = document.getElementById("taskList");

function formatDate(dateStr) {
    if (!dateStr) return "No due date";
    const d = new Date(dateStr);
    const day = String(d.getDate()).padStart(2,'0');
    const month = String(d.getMonth()+1).padStart(2,'0');
    const year = d.getFullYear();
    return `${day}/${month}/${year}`;
}

function getImportanceColor(value) {
    if(!value) return "#888";
    if(value <=3) return "#22c55e";
    if(value <=6) return "#eab308";
    if(value <=8) return "#f97316";
    return "#ef4444";
}

function renderTasks() {
    taskList.innerHTML = "";
    tasks.forEach((task, i) => {
        const div = document.createElement("div");
        div.className = "task";
        const due = formatDate(task.due);
        const importanceColor = getImportanceColor(task.importance);
        div.innerHTML = `
            <div class="task-left">
                <div class="task-title">${task.title}</div>
                <div class="task-type">${task.type}</div>
                <div class="task-desc">${task.description || ""}</div>
                <div class="task-meta">
                    <span>📅 ${due}</span>
                    ${task.importance ? `<span style="color:${importanceColor}">● Priority ${task.importance}</span>` : ""}
                </div>
            </div>
            <button class="delete-btn" onclick="deleteTask(${i})">Delete</button>
        `;
        taskList.appendChild(div);
    });
}

document.getElementById("addBtn").addEventListener("click", () => {
    const title = document.getElementById("title").value;
    const type = document.getElementById("type").value;
    const description = document.getElementById("description").value;
    const due = document.getElementById("due").value;
    const importance = document.getElementById("importance").value;

    if(!title || !type) return alert("Title and type are required.");

    const newTask = { user: currentUser.email, title, type, description, due, importance };
    tasks.push(newTask);
    localStorage.setItem("mockTasks", JSON.stringify(tasks));
    renderTasks();

    document.getElementById("title").value = "";
    document.getElementById("type").value = "";
    document.getElementById("description").value = "";
    document.getElementById("due").value = "";
    document.getElementById("importance").value = "";
});

function deleteTask(i) {
    tasks.splice(i,1);
    localStorage.setItem("mockTasks", JSON.stringify(tasks));
    renderTasks();
}

document.getElementById("logoutBtn").addEventListener("click", () => {
    alert("Mock logout!"); 
    // For testing, don't redirect
});

renderTasks();
</script>

</body>
</html>
