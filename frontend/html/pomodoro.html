<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="../css/pomodoro.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-links">
            <a href="./tasks.html">Tasks</a>
            <a href="./pomodoro.html">Pomodoro timer</a>
            <a href="./flashcards.html">Flashcards</a>
        </div>
        <div class="user-controls">
            <a href="./register.html">Register</a>
            <button class="logout" id="logoutBtn">Logout</button>
            <a href="./deleteAccount.html" id="deleteAccLink">Delete Account</a>
        </div>
    </nav>

    <div class="pomodoro-container">

        <div class="timer">
            <h1 id="time">40:00</h1>
            <h2 id="statusMessage">Get ready!</h2>
            <p id="mode">Work</p>

            <div class="controls">
                <button id="start">Start</button>
                <button id="pause">Pause</button>
                <button id="reset">Reset</button>
            </div>
        </div>

        <div class="session-counter">
            Sessions completed: <span id="sessionCount">0</span>
        </div>

        <div class="add-setting">
            <input type="text" id="labelInput" placeholder="Label">
            <input type="number" id="workInput" placeholder="Work (min)">
            <input type="number" id="breakInput" placeholder="Break (min)">
            <button id="addSetting">Add</button>
        </div>

        <div class="settings" id="settingsList"></div>

    </div>

    <script src="../js/pomodoroLogic.js"></script>
</body>
</html>
