<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - BrainGrow</title>
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">Admin Dashboard</div>
        <a href="pomodoro.html" style="color: white; margin-left: 20px;">Back to App</a>
    </nav>

    <div class="admin-container">
        <h1>User Management</h1>
        <table id="userTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="userList">
            </tbody>
        </table>
    </div>
    <div id="editModal" class="modal">
        <div class="modal-content">
            <h2>Edit User</h2>
            <input type="hidden" id="editUserId">

            <label>Username</label>
            <input type="text" id="editUsername">

            <label>Email</label>
            <input type="email" id="editEmail">

            <label>New Password (leave blank to keep current)</label>
            <input type="password" id="editPassword" placeholder="********">

            <label>Role</label>
            <select id="editRole">
                <option value="user">user</option>
                <option value="admin">admin</option>
            </select>

            <div class="modal-actions">
                <button onclick="saveEdit()" class="save-btn">Save Changes</button>
                <button onclick="closeModal()" class="cancel-btn">Cancel</button>
            </div>
        </div>
    </div>
    <script src="../js/admin.js"></script>
</body>
</html>
